          if needle not in x: raise SystemExit("saveLocation pattern not found")
          x=x.replace(needle,replacement,1)
          p.write_text(x)

          p=Path("app/src/main/java/com/inaki/micoche/MainActivity.java"); x=p.read_text()
          x=x.replace('summary.setText(GaragePrefs.summary(this));',
                      'summary.setText(GaragePrefs.summary(this) + "\\nDetección automática: 100 m. Se guarda la posición GPS precisa del coche.");')
          needle='''        requestFreshLocation(location -> {
