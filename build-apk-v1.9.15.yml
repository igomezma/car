      - name: "Apply v1.9.14 precise disconnect GPS"
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("app/build.gradle"); x=p.read_text()
          x=x.replace("versionCode 23","versionCode 24").replace('versionName "1.9.13"','versionName "1.9.14"'); p.write_text(x)
          p=Path("app/src/main/res/values/strings.xml"); p.write_text(p.read_text().replace("v1.9.13","v1.9.14"))
          p=Path("app/src/main/java/com/inaki/micoche/AutoParkingManager.java"); x=p.read_text()
          x=x.replace("import android.location.LocationManager;", "import android.location.LocationManager;\nimport android.location.LocationListener;\nimport android.os.Bundle;\nimport android.os.Handler;\nimport android.os.Looper;")
          a=x.index("    public static void saveAutomaticParking(Context context, boolean testMode) {")
          b=x.index("\n    private static Location bestRecentLocation",a)
          method="""    public static void saveAutomaticParking(Context context, boolean testMode) {
        if (!testMode && !AutoParkingPrefs.enabled(context)) return;
        if (!hasForegroundLocation(context) || !hasBackgroundLocation(context)) {
            AutoParkingPrefs.setLastEvent(context, "No se guardó: falta ubicación todo el tiempo.");
            return;
        }
        if (!testMode && AutoParkingPrefs.recentlyAutoSaved(context)) return;
        LocationManager lm=(LocationManager)context.getSystemService(Context.LOCATION_SERVICE);
        if (testMode) {
            Location old=bestRecentLocation(lm);
            if(old!=null) saveLocation(context,old,true); else waitForPreciseGps(context,lm,true);
        } else waitForPreciseGps(context,lm,false);
    }

    private static void waitForPreciseGps(Context context, LocationManager lm, boolean testMode) {
        final long disconnectedAt=System.currentTimeMillis();
        final Location[] best={null};
        final Handler h=new Handler(Looper.getMainLooper());
        final LocationListener[] ref=new LocationListener[1];
        ref[0]=new LocationListener() {
            @Override public void onLocationChanged(Location l) {
                if(l==null || l.getTime()<disconnectedAt-2000L || !l.hasAccuracy()) return;
                if(best[0]==null || l.getAccuracy()<best[0].getAccuracy()) best[0]=l;
                if(l.getAccuracy()<=20f) {
                    try{lm.removeUpdates(ref[0]);}catch(Exception ignored){}
                    h.removeCallbacksAndMessages(null);
                    saveLocation(context,l,testMode);
                }
            }
            @Override public void onStatusChanged(String p,int s,Bundle e){}
            @Override public void onProviderEnabled(String p){}
            @Override public void onProviderDisabled(String p){}
        };
        AutoParkingPrefs.setLastEvent(context,"Bluetooth desconectado: buscando GPS preciso…");
        notifyStatus(context,"Aparcamiento detectado","Buscando una posición GPS precisa.");
        try {
            if(lm.isProviderEnabled(LocationManager.GPS_PROVIDER)) lm.requestLocationUpdates(LocationManager.GPS_PROVIDER,1000L,0f,ref[0],Looper.getMainLooper());
            if(lm.isProviderEnabled(LocationManager.NETWORK_PROVIDER)) lm.requestLocationUpdates(LocationManager.NETWORK_PROVIDER,1000L,0f,ref[0],Looper.getMainLooper());
        } catch(SecurityException e){ return; }
        h.postDelayed(() -> {
            try{lm.removeUpdates(ref[0]);}catch(Exception ignored){}
            Location l=best[0];
            if(l!=null && l.hasAccuracy() && l.getAccuracy()<=35f) saveLocation(context,l,testMode);
            else {
                AutoParkingPrefs.setLastEvent(context,"Bluetooth desconectado: esperando GPS preciso.");
                notifyStatus(context,"Parking · esperando GPS","No guardaré una posición imprecisa. Usa Parking si estás bajo cubierta.");
            }
        },60000L);
    }
"""
          p.write_text(x[:a]+method+x[b:])
          PY

