          package com.inaki.micoche;
          import android.content.Context;
          import android.content.SharedPreferences;
          import android.location.Location;
          public final class GaragePrefs {
              private static final String PREFS="known_garages";
              public static final String HOME="Casa", HOME2="Casa 2", WORK="Trabajo";
              private static final String[] NAMES={HOME,HOME2,WORK};
              private GaragePrefs(){}
              private static SharedPreferences p(Context c){return c.getSharedPreferences(PREFS,Context.MODE_PRIVATE);}
              private static String k(String n,String s){return n.toLowerCase().replace(" ","_")+"_"+s;}
              public static void save(Context c,String n,double lat,double lon){p(c).edit().putBoolean(k(n,"set"),true).putLong(k(n,"lat"),Double.doubleToRawLongBits(lat)).putLong(k(n,"lon"),Double.doubleToRawLongBits(lon)).apply();}
              public static boolean has(Context c,String n){return p(c).getBoolean(k(n,"set"),false);}
              public static double lat(Context c,String n){return Double.longBitsToDouble(p(c).getLong(k(n,"lat"),Double.doubleToRawLongBits(0)));}
              public static double lon(Context c,String n){return Double.longBitsToDouble(p(c).getLong(k(n,"lon"),Double.doubleToRawLongBits(0)));}
              public static String nearestName(Context c,double lat,double lon,float max){String best=null;float bd=Float.MAX_VALUE;float[] d=new float[1];for(String n:NAMES){if(!has(c,n))continue;Location.distanceBetween(lat,lon,lat(c,n),lon(c,n),d);if(d[0]<=max&&d[0]<bd){bd=d[0];best=n;}}return best;}
              public static String summary(Context c){return one(c,HOME)+" | "+one(c,HOME2)+" | "+one(c,WORK);}
              private static String one(Context c,String n){return has(c,n)?"✓ "+n:"○ "+n;}
          }
          JAVA

