name: Build Where Is My Car v1.9.18
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk WhereIsMyCar-v1.9.18.apk
      - uses: actions/upload-artifact@v4
        with:
          name: WhereIsMyCar-v1.9.18-APK
          path: WhereIsMyCar-v1.9.18.apk
          if-no-files-found: error
          retention-days: 30
