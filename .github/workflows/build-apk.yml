name: Build Mi Coche actual

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Descargar proyecto actual
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Renombrar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MiCoche-v1.1.apk

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: MiCoche-v1.1-APK
          path: MiCoche-v1.1.apk
          if-no-files-found: error
          retention-days: 30
