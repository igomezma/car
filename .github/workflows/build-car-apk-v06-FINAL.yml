name: Build Mi Coche APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Restore Mi Coche v0.6 project
        shell: bash
        run: |
          set -e
          rm -rf app build.gradle settings.gradle gradle.properties README.md project.zip project.b64 micoche-signing.jks
          cat > project.b64 <<'PROJECT_B64'
          
          PROJECT_B64
          base64 -d project.b64 > project.zip
          unzip -q project.zip
          rm -f project.b64 project.zip

      - name: Restore stable signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.MI_COCHE_KEYSTORE_B64 }}
        run: |
          set -e
          if [ -z "$KEYSTORE_B64" ]; then
            echo "Falta el secret MI_COCHE_KEYSTORE_B64"
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > micoche-signing.jks
          keytool -list -keystore micoche-signing.jks -storepass 'MiCoche-2026-TEST' -alias micoche >/dev/null

      - name: Build signed release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Prepare APK
        run: cp app/build/outputs/apk/release/app-release.apk MiCoche-v0.6.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiCoche-v0.6-APK
          path: MiCoche-v0.6.apk
          if-no-files-found: error

      - name: Publish APK in Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v0.6 >/dev/null 2>&1; then
            gh release create v0.6 --target "$GITHUB_SHA" --title "Mi Coche v0.6" --notes "Corrige el cierre al abrir: elimina WebView del arranque, usa mapa nativo por captura OSM y simplifica el widget para HyperOS."
          fi
          gh release upload v0.6 MiCoche-v0.6.apk --clobber
