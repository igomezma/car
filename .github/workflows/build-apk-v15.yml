name: Build Where's My Car v1.5

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compilar APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Renombrar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk WheresMyCar-v1.5.apk
      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: WheresMyCar-v1.5-APK
          path: WheresMyCar-v1.5.apk
          if-no-files-found: error
          retention-days: 30
      - name: Preparar clave privada de Google Play
        if: ${{ secrets.UPLOAD_KEYSTORE_BASE64 != '' }}
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: echo "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > upload-keystore.jks
      - name: Compilar AAB firmado para Google Play
        if: ${{ secrets.UPLOAD_KEYSTORE_BASE64 != '' }}
        env:
          UPLOAD_KEYSTORE_PATH: ${{ github.workspace }}/upload-keystore.jks
          UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: gradle :app:bundleRelease --stacktrace
      - name: Renombrar AAB
        if: ${{ secrets.UPLOAD_KEYSTORE_BASE64 != '' }}
        run: cp app/build/outputs/bundle/release/app-release.aab WheresMyCar-v1.5-PlayStore.aab
      - name: Subir AAB para Google Play
        if: ${{ secrets.UPLOAD_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: WheresMyCar-v1.5-PLAY-STORE
          path: WheresMyCar-v1.5-PlayStore.aab
          if-no-files-found: error
          retention-days: 90
