name: Build Mi Coche APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Restore Mi Coche v0.4 project
        shell: bash
        run: |
          set -e
          rm -rf app build.gradle settings.gradle gradle.properties README.md project.zip
          cat > project.b64 <<'PROJECT_B64'
          
          PROJECT_B64
          base64 -d project.b64 > project.zip
          unzip -q project.zip
          rm -f project.b64 project.zip

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MiCoche-v0.4.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiCoche-v0.4-APK
          path: MiCoche-v0.4.apk
          if-no-files-found: error

      - name: Publish APK in Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v0.4 >/dev/null 2>&1; then
            gh release create v0.4 --target "$GITHUB_SHA" --title "Mi Coche v0.4" --notes "Widget 4x4 funcional, interfaz renovada, icono Atacama, mapa y navegación al coche."
          fi
          gh release upload v0.4 MiCoche-v0.4.apk --clobber
